<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — My Photo Club</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Archivo+Narrow:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=12">

<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="../" class="logo">
      <img src="../assets/mpc-logo-mark.png" alt="My Photo Club" class="logo-img">
    </a>
  </div>
</header>

<main>
  <section class="hero thanks">
    <div class="container thanks-inner">
      <span class="tag-label">MY PHOTO CLUB</span>

      <h1 class="hero-title">ALMOST THERE.<br><span class="accent">CHECK YOUR INBOX.</span></h1>

      <div class="hero-rule hero-rule--center"></div>

      <ol class="thanks-steps">
        <li><span class="thanks-num">01</span>Check your inbox (and the spam or promotions folder, just in case).</li>
        <li><span class="thanks-num">02</span>Click the confirmation link in the email.</li>
        <li><span class="thanks-num">03</span>Get ready to share, connect and create with us.</li>
      </ol>

      <a href="../" class="btn btn-outline">Back to My Photo Club</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="logo-text logo-text--footer">MPC</span>
    <p>&copy; 2026 My Photo Club. All rights reserved.</p>
  </div>
</footer>
